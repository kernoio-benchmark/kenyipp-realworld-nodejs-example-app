services:
  mysql:
    image: mysql:8.0
    pull_policy: missing
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_USER=conduit_user
      - MYSQL_PASSWORD=conduit_password
      - MYSQL_DATABASE=conduit_db
    ports:
      - 3306
    tmpfs:
      - /var/lib/mysql
    labels:
      - external-url=mysql://conduit_user:conduit_password@localhost:{{PORT}}/conduit_db
    healthcheck:
      interval: 3s
      timeout: 5s
      retries: 10
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -P 3306 -u conduit_user --password=conduit_password

  sut:
    build:
      context: ${BUILD_CONTEXT}
      dockerfile_inline: |
        #
        # Base image for the server
        #
        FROM node:18 AS base

        ARG WORKSPACE_SCOPE=@conduit/user

        # Set working directory
        WORKDIR /app
        RUN yarn global add turbo

        # Copy the project files
        COPY . .

        # Use the build argument in the turbo prune command
        RUN turbo prune --scope=$$WORKSPACE_SCOPE --docker

        #
        # Installer image
        # Add lockfile and package.json's of isolated sub-workspace
        #
        FROM node:18 AS installer

        ARG WORKSPACE_SCOPE=@conduit/user

        # Set working directory
        WORKDIR /app

        # Install turbo globally
        RUN yarn global add turbo

        # Copy necessary files to the installer stage
        COPY .gitignore .gitignore
        COPY --from=base /app/out/json/ .
        COPY --from=base /app/out/yarn.lock ./yarn.lock

        # Install dependencies
        RUN yarn install

        # Build the project using the variable scope
        COPY --from=base /app/out/full/ .
        RUN turbo run build --filter=$$WORKSPACE_SCOPE...

        #
        # Production image
        #
        FROM node:18-slim AS production

        WORKDIR /app

        # Copy built artifacts and dependencies
        COPY --from=installer /app .

        # Set production environment
        ENV NODE_ENV=production

        # Expose port (default Express port)
        EXPOSE 3000

        # Start the application (Lambda handler or local server)
        CMD ["node", "apps/user/dist/index.js"]
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000"
    labels:
      - jwt-signing-config=HS256:AUTH_JWT_SECRET
