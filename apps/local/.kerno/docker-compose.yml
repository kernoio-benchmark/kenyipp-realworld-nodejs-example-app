services:
  mysql:
    image: mysql:9.1.0
    pull_policy: missing
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_USER=conduit_user
      - MYSQL_PASSWORD=conduit_password
      - MYSQL_DATABASE=conduit
    ports:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      interval: 3s
      timeout: 5s
      retries: 10
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -P 3306 -u conduit_user --password=conduit_password

  sut:
    build:
      context: ${BUILD_CONTEXT}
      args:
        WORKSPACE_SCOPE: "@conduit/local"
      dockerfile_inline: |
        #
        # Base image for the server
        #
        FROM node:18 AS base

        ARG WORKSPACE_SCOPE

        # Set working directory
        WORKDIR /app
        RUN yarn global add turbo

        # Copy the project files
        COPY . .

        # Use the build argument in the turbo prune command
        RUN turbo prune --scope=$${WORKSPACE_SCOPE} --docker

        #
        # Installer image
        # Add lockfile and package.json's of isolated sub-workspace
        #
        FROM node:18 AS installer

        ARG WORKSPACE_SCOPE

        # Set working directory
        WORKDIR /app

        # Install turbo globally
        RUN yarn global add turbo

        # Copy necessary files to the installer stage
        COPY .gitignore .gitignore
        COPY --from=base /app/out/json/ .
        COPY --from=base /app/out/yarn.lock ./yarn.lock

        # Install dependencies
        RUN yarn install

        # Build the project using the variable scope
        COPY --from=base /app/out/full/ .
        RUN turbo run build --filter=$${WORKSPACE_SCOPE}...

        #
        # Runner image
        # Use slim variant for smaller final image
        #
        FROM node:18-slim AS runner

        # Set working directory
        WORKDIR /app

        # Set NODE_CONFIG_DIR environment variable
        ENV NODE_CONFIG_DIR=/app/config

        # Copy built application and dependencies from installer
        COPY --from=installer /app .

        # Expose port (default Express port)
        EXPOSE 3000

        # Run the application
        CMD ["node", "apps/local/local.js"]
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./config/local.json:/app/config/local.json:ro
    ports:
      - "3000"

volumes:
  mysql_data:
